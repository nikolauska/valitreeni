# Builds and publishes a release when scripts/release.sh pushes a version tag.
# Installed apps read the newest release from here, so only a correctly signed APK may be published.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^valitreeni.version=//p' gradle.properties)
          [[ "$TAG" == "v$version" ]] || { echo "::error::Tag $TAG but gradle.properties says $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VALITREENI_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "::error::Secret VALITREENI_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease

      # Signs with the current key plus app/signing/lineage.bin, which is how phones still holding the
      # original key accept it. The script refuses a lineage that doesn't start at the key on those phones.
      - name: Sign
        env:
          VALITREENI_STORE_FILE: ${{ runner.temp }}/release.jks
          VALITREENI_STORE_PASSWORD: ${{ secrets.VALITREENI_STORE_PASSWORD }}
        run: scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "valitreeni-$VERSION.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout gives a lightweight copy of the tag; fetch the annotated one to read its message.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          notes=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')
          if [[ -z "$notes" || "$notes" == "Välitreeni $VERSION" ]]; then
            gh release create "$TAG" "valitreeni-$VERSION.apk" --title "Välitreeni $VERSION" --generate-notes
          else
            gh release create "$TAG" "valitreeni-$VERSION.apk" --title "Välitreeni $VERSION" --notes "$notes"
          fi
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
