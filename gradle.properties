# Kept small so a build and the emulator fit side by side in WSL's memory.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle daemon instead of a second JVM, which saves about 1 GB.
kotlin.compiler.execution.strategy=in-process
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The last released version. scripts/release.sh raises it when publishing the next one.
valitreeni.version=0.2.0
